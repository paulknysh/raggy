# Database & Storage Configuration
sources:
  - "./sample_docs_pt1"
  - "./sample_docs_pt2"

persist_directory: "./chroma_db"
embedding_model: "nomic-embed-text"
chunk_size: 500
chunk_overlap: 100
n_batches: 20

# LLM Configuration
llm_model: "llama3.2"
temperature: 0.0

# RAG Pipeline Configuration
search_type: "mmr"
retrieve_k: 5
mmr_fetch_k: 25

# Cross-encoder re-ranking (optional; toggle on/off for A/B testing)
# Pipeline is always: first-stage retrieval (see search_type above) → optional cross-encoder.
# The first stage always returns retrieve_k chunks (mmr_fetch_k is the MMR candidate
# pool, used only when search_type is "mmr");
# when re-ranking is enabled the cross-encoder narrows them down to rerank_k
# (must be no greater than retrieve_k).
rerank_enabled: false
rerank_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
rerank_k: 5

system_prompt: |
  You are a helpful assistant. Answer the question using ONLY the provided context below. If you don't know the answer or if it is not in the context, say that you do not know.

  Context:
  {context}
