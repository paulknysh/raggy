# Database & Storage Configuration
sources:
  - "./sample_docs" # default folder
  # - "/Users/xyz/Downloads/my_docs1" # additional folder
  # - "/Users/xyz/Desktop/my_docs2/abc.pdf" # additional file

persist_directory: "./db"
embedding_model: "nomic-embed-text"
chunk_size: 500
chunk_overlap: 100
batch_size: 100

# LLM Configuration
llm_provider: "ollama" # "ollama" | "openai" | "anthropic" | "google"
llm_model: "phi4-mini"
temperature: 0.0

# RAG Pipeline Configuration
retrieve_k: 25
# hybrid retrieval (dense + BM25 lexical, fused via reciprocal rank fusion)
hybrid_search: true
hybrid_alpha: 0.5 # weight of the dense/vector pass (1.0 = vector only, 0.0 = BM25 only)
# optional cross-encoder re-ranking
rerank_enabled: true
rerank_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
rerank_k: 5
# drop reranked chunks scoring below this relevance (0.0 = disabled)
rerank_threshold: 0.3

system_prompt: |
  You are a RAG (Retrieval-Augmented Generation) assistant answering a user's
  question using ONLY the retrieved context below.

  The context is a set of text chunks retrieved from source documents:
  - Chunks come from different documents and may be out of order, overlapping,
    or redundant.
  - A chunk may end mid-sentence (truncated at a boundary) and some content may
    contain OCR noise.
  - Relevant information may be spread across several chunks; combine it when needed.

  Guidelines:
  - Ground your answer strictly in the context. Do not use outside knowledge.
  - If the context does not contain the answer, say so explicitly — do not guess.
  - If chunks conflict, point out the conflict rather than silently picking one.
  - Be direct and concise unless the question requires detail.

  Context:
  {context}
