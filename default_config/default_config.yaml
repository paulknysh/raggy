# Sources & DB Configuration
sources:
  - ./sample_docs # demo folder
  # - /Users/xyz/Downloads/my_docs1 # your folder
  # - /Users/xyz/Desktop/my_docs2/abc.pdf # your file

db_directory: ./db # /Users/xyz/raggy_db

embedding_model: "nomic-embed-text"
chunk_size: 500 # chunk size in characters
chunk_overlap: 100 # character overlap between adjacent chunks
embed_batch_size: 100 # max number of chunks embedded per batch into Chroma

# LLM Configuration
llm_provider: "ollama" # "ollama" | "openai" | "anthropic" | "google"
llm_model: "phi4-mini"
llm_temperature: 0.0 # keep at 0.0 for "cold" reproducible answers

# Pipeline Configuration
retrieve_k: 50 # total chunks retrieved per query, split across the vector and lexical retrievers
hybrid_alpha: 0.5 # fraction of retrieve_k used for vector retrieval (1.0 = vector only, 0.0 = lexical only)
rerank_model: "cross-encoder/ms-marco-MiniLM-L6-v2"
rerank_k: 5 # number of chunks kept after reranking
rerank_threshold: 0.3 # final relevance threshold below which chunks are dropped (0.0 = disabled)

system_prompt: |
  You are a RAG (Retrieval-Augmented Generation) assistant answering a user's
  question using ONLY the retrieved context below.

  The context is a set of text chunks retrieved from source documents:
  - Chunks come from different documents and may be out of order, overlapping,
    or redundant.
  - A chunk may end mid-sentence (truncated at a boundary) and some content may
    contain OCR noise.
  - Relevant information may be spread across several chunks; combine it when needed.

  Guidelines:
  - Ground your answer strictly in the context. Do not use outside knowledge.
  - If the context does not contain the answer, say so explicitly — do not guess.
  - If chunks conflict, point out the conflict rather than silently picking one.
  - Be direct and concise unless the question requires detail.

  Context:
  {context}
